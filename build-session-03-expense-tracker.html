import sqlite3
from datetime import date
from decimal import Decimal, InvalidOperation, ROUND_HALF_UP


def connect(path="expenses.db"):
    conn = sqlite3.connect(path)
    conn.execute(
        """CREATE TABLE IF NOT EXISTS expenses (
            id INTEGER PRIMARY KEY AUTOINCREMENT,
            day TEXT NOT NULL,
            cents INTEGER NOT NULL CHECK (cents > 0),
            category TEXT NOT NULL,
            note TEXT NOT NULL DEFAULT ''
        )"""
    )
    return conn


def to_cents(text):
    try:
        amount = Decimal(text.strip())
    except InvalidOperation:
        raise ValueError(f"'{text}' is not a number")
    if not amount.is_finite():
        raise ValueError(f"'{text}' is not a number")
    if amount <= 0:
        raise ValueError("amount must be more than zero")
    if amount > 1000000:
        raise ValueError("amount is too large (the limit is 1000000)")
    cents = int((amount * 100).quantize(Decimal(1), rounding=ROUND_HALF_UP))
    if cents == 0:
        raise ValueError("amount must be at least 0.01")
    return cents


def money(cents):
    return f"{cents // 100}.{cents % 100:02d}"


def add(conn, cents, category, note="", day=None):
    day = day or date.today().isoformat()
    cur = conn.execute(
        "INSERT INTO expenses (day, cents, category, note) VALUES (?, ?, ?, ?)",
        (day, cents, category, note),
    )
    conn.commit()
    return cur.lastrowid


def list_all(conn):
    return conn.execute(
        "SELECT id, day, cents, category, note FROM expenses ORDER BY id"
    ).fetchall()


def totals(conn):
    return conn.execute(
        "SELECT category, SUM(cents) FROM expenses GROUP BY category ORDER BY SUM(cents) DESC"
    ).fetchall()


def remove(conn, expense_id):
    cur = conn.execute("DELETE FROM expenses WHERE id = ?", (expense_id,))
    conn.commit()
    return cur.rowcount == 1

import argparse
import os
import sys

import db


def main(argv=None):
    parser = argparse.ArgumentParser(description="A tiny expense tracker.")
    sub = parser.add_subparsers(dest="command", required=True)

    add = sub.add_parser("add", help="add an expense")
    add.add_argument("amount", help="for example 12.50")
    add.add_argument("category", help="for example food")
    add.add_argument("note", nargs="?", default="", help="optional note")

    sub.add_parser("list", help="show all expenses")
    sub.add_parser("summary", help="totals per category")

    delete = sub.add_parser("delete", help="delete an expense by id")
    delete.add_argument("id", type=int)

    args = parser.parse_args(argv)
    conn = db.connect(os.environ.get("EXPENSES_DB", "expenses.db"))

    if args.command == "add":
        try:
            cents = db.to_cents(args.amount)
        except ValueError as err:
            parser.error(str(err))
        category = args.category.strip().lower()
        if not category:
            parser.error("category cannot be empty")
        new_id = db.add(conn, cents, category, args.note)
        print(f"Added #{new_id}: {db.money(cents)} {category}")
    elif args.command == "list":
        rows = db.list_all(conn)
        if not rows:
            print("No expenses yet.")
        for row_id, day, cents, category, note in rows:
            print(f"{row_id:>3}  {day}  {db.money(cents):>8}  {category:<10} {note}")
    elif args.command == "summary":
        rows = db.totals(conn)
        for category, cents in rows:
            print(f"{category:<12} {db.money(cents):>8}")
        print(f"{'total':<12} {db.money(sum(c for _, c in rows)):>8}")
    elif args.command == "delete":
        if db.remove(conn, args.id):
            print(f"Deleted #{args.id}")
        else:
            print(f"No expense #{args.id}", file=sys.stderr)
            return 1
    return 0


if __name__ == "__main__":
    sys.exit(main())

import contextlib
import io
import os
import tempfile
import unittest

import db
import expenses


class DbTests(unittest.TestCase):
    def setUp(self):
        self.conn = db.connect(":memory:")

    def test_to_cents(self):
        self.assertEqual(db.to_cents("12.50"), 1250)
        self.assertEqual(db.to_cents("0.1"), 10)
        self.assertEqual(db.to_cents("3"), 300)
        self.assertEqual(db.to_cents("12.345"), 1235)

    def test_bad_amounts_are_rejected(self):
        for bad in ("abc", "-5", "0", "nan", "inf", "1e999", "0.001", "99999999999999999999"):
            with self.assertRaises(ValueError):
                db.to_cents(bad)

    def test_add_and_list(self):
        db.add(self.conn, 1250, "food", "lunch", day="2026-01-02")
        self.assertEqual(db.list_all(self.conn), [(1, "2026-01-02", 1250, "food", "lunch")])

    def test_totals_biggest_first(self):
        db.add(self.conn, 500, "food")
        db.add(self.conn, 1500, "rent")
        db.add(self.conn, 700, "food")
        self.assertEqual(db.totals(self.conn), [("rent", 1500), ("food", 1200)])

    def test_remove(self):
        new_id = db.add(self.conn, 500, "food")
        self.assertTrue(db.remove(self.conn, new_id))
        self.assertFalse(db.remove(self.conn, new_id))

    def test_quotes_in_text_are_safe(self):
        db.add(self.conn, 400, "coffee", "Sam's \\"best\\" cafe; DROP TABLE expenses;--")
        self.assertEqual(len(db.list_all(self.conn)), 1)


class CliTests(unittest.TestCase):
    def run_cli(self, *argv):
        out = io.StringIO()
        with contextlib.redirect_stdout(out):
            code = expenses.main(list(argv))
        return code, out.getvalue()

    def test_add_then_list(self):
        with tempfile.TemporaryDirectory() as folder:
            os.environ["EXPENSES_DB"] = os.path.join(folder, "test.db")
            self.assertEqual(self.run_cli("add", "4.20", "Coffee")[1], "Added #1: 4.20 coffee\\n")
            self.assertIn("4.20", self.run_cli("list")[1])

    def test_bad_amount_exits_with_error(self):
        with tempfile.TemporaryDirectory() as folder:
            os.environ["EXPENSES_DB"] = os.path.join(folder, "test.db")
            with contextlib.redirect_stderr(io.StringIO()):
                with self.assertRaises(SystemExit) as caught:
                    self.run_cli("add", "abc", "food")
            self.assertEqual(caught.exception.code, 2)


if __name__ == "__main__":
    unittest.main()
