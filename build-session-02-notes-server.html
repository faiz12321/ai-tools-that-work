ff}.out{color:#d6cfe6;margin-top:4px}.quiet{color:#7f7496;font-size:15px;font-style:italic}.mini{color:var(--acc2);font-size:13px;margin:0 0 3px;font-family:ui-sans-serif,system-ui,sans-serif;text-transform:uppercase;letter-spacing:.06em}.srv{margin-top:8px;border-left:3px solid var(--acc2);padding-left:10px}.srv pre{color:#c9bdf0}.pasted{margin:2px 0 0 18px;font-size:15px}.pasted summary{cursor:pointer;color:var(--mut)}.pasted pre{max-height:30vh;overflow:auto;color:#cfc6e3;margin-top:6px}.lesson{margin-top:10px;padding:12px 14px;background:var(--card2);border-radius:10px;border-left:4px solid var(--ok);color:var(--ink);font:400 17px/1.5 ui-sans-serif,system-ui,sans-serif}.lesson b{color:var(--ok)}.prompt{display:flex;gap:8px;align-items:center}.prompt input{flex:1;min-width:0;background:transparent;border:0;border-bottom:2px solid var(--line);color:#fff;font:400 17px/1.5 ui-monospace,Menlo,Consolas,monospace;padding:6px 2px}.prompt input::placeholder{color:#6a5f82}.actions{display:flex;gap:12px;margin-top:14px;align-items:stretch}.chip{flex:1;text-align:left;background:var(--card);color:var(--ink);border:2px dashed var(--acc);border-radius:12px;padding:10px 14px;cursor:pointer;font:600 15px/1.3 ui-sans-serif,system-ui,sans-serif;display:flex;flex-direction:column;gap:4px;min-width:0}.chip code{font:400 15px ui-monospace,Menlo,Consolas,monospace;color:var(--acc);overflow-wrap:anywhere}.wrong{margin-top:12px;padding:12px 14px;border-radius:10px;background:#3a1a22;border-left:4px solid #ff6b7d;font-size:17px}.end{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}.end code,.muted code{background:var(--card2);padding:1px 6px;border-radius:6px;font-family:ui-monospace,Menlo,monospace}.notes{margin-top:32px;padding:16px 18px;border:1px solid var(--line);border-radius:14px;color:var(--mut);font-size:15px;line-height:1.55}.notes ul{margin:0;padding-left:20px;display:grid;gap:6px}@media(min-width:900px){.bs{padding:32px 32px import http from 'node:http';

const notes = [];
let nextId = 1;

function send(res, status, body) {
  res.writeHead(status, { 'Content-Type': 'application/json' });
  res.end(JSON.stringify(body));
}

const server = http.createServer((req, res) => {
  console.log(\`\${req.method} \${req.url}\`);
  if (req.method === 'GET' && req.url === '/notes') {
    return send(res, 200, notes);
  }
  if (req.method === 'POST' && req.url === '/notes') {
    let raw = '';
    req.on('data', (chunk) => (raw += chunk));
    req.on('end', () => {
      let data;
      try {
        data = JSON.parse(raw);
      } catch {
        return send(res, 400, { error: 'invalid JSON' });
      }
      if (data === null || typeof data !== 'object' || typeof data.text !== 'string' || data.text.trim() === '') {
        return send(res, 400, { error: 'text is required' });
      }
      const note = { id: nextId++, text: data.text.trim() };
      notes.push(note);
      send(res, 201, note);
    });
    return;
  }
  send(res, 404, { error: 'not found' });
});

server.listen(3000, '127.0.0.1', () => {
  console.log('Notes server on http://127.0.0.1:3000');
});

import fs from 'node:fs';

export function createStore(file) {
  let notes = fs.existsSync(file) ? JSON.parse(fs.readFileSync(file, 'utf8')) : [];
  const save = () => fs.writeFileSync(file, JSON.stringify(notes, null, 2));

  return {
    all: () => notes,
    add(text) {
      const id = notes.reduce((max, n) => Math.max(max, n.id), 0) + 1;
      const note = { id, text };
      notes.push(note);
      save();
      return note;
    },
    remove(id) {
      const before = notes.length;
      notes = notes.filter((n) => n.id !== id);
      if (notes.length === before) return false;
      save();
      return true;
    },
  };
}

import http from 'node:http';
import { pathToFileURL } from 'node:url';
import { createStore } from './store.js';

function send(res, status, body) {
  if (status === 204) {
    res.writeHead(204);
    return res.end();
  }
  res.writeHead(status, { 'Content-Type': 'application/json' });
  res.end(JSON.stringify(body));
}

export function createServer(store, log = () => {}) {
  return http.createServer((req, res) => {
    log(\`\${req.method} \${req.url}\`);
    const url = new URL(req.url, 'http://localhost');

    if (url.pathname === '/notes' && req.method === 'GET') {
      return send(res, 200, store.all());
    }
    if (url.pathname === '/notes' && req.method === 'POST') {
      let raw = '';
      req.on('data', (chunk) => (raw += chunk));
      req.on('end', () => {
        let data;
        try {
          data = JSON.parse(raw);
        } catch {
          return send(res, 400, { error: 'invalid JSON' });
        }
        if (data === null || typeof data !== 'object' || typeof data.text !== 'string' || data.text.trim() === '') {
          return send(res, 400, { error: 'text is required' });
        }
        send(res, 201, store.add(data.text.trim()));
      });
      return;
    }
    const match = url.pathname.match(/^\\/notes\\/(\\d+)$/);
    if (match && req.method === 'DELETE') {
      return store.remove(Number(match[1]))
        ? send(res, 204)
        : send(res, 404, { error: 'no such note' });
    }
    send(res, 404, { error: 'not found' });
  });
}

if (import.meta.url === pathToFileURL(process.argv[1]).href) {
  const port = Number(process.env.PORT) || 3000;
  createServer(createStore('notes.json'), console.log).listen(port, '127.0.0.1', () => {
    console.log(\`Notes server on http://127.0.0.1:\${port}\`);
  });
}

import { test } from 'node:test';
import assert from 'node:assert/strict';
import fs from 'node:fs';
import os from 'node:os';
import path from 'node:path';
import { createServer } from './server.js';
import { createStore } from './store.js';

async function withServer(fn) {
  const dir = fs.mkdtempSync(path.join(os.tmpdir(), 'notes-'));
  const file = path.join(dir, 'notes.json');
  const server = createServer(createStore(file));
  await new Promise((resolve) => server.listen(0, '127.0.0.1', resolve));
  const base = \`http://127.0.0.1:\${server.address().port}\`;
  try {
    await fn(base, file);
  } finally {
    server.close();
  }
}

const post = (base, body) =>
  fetch(\`\${base}/notes\`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });

test('starts with no notes', () =>
  withServer(async (base) => {
    const res = await fetch(\`\${base}/notes\`);
    assert.equal(res.status, 200);
    assert.deepEqual(await res.json(), []);
  }));

test('adds a note and lists it', () =>
  withServer(async (base) => {
    const res = await post(base, { text: 'buy milk' });
    assert.equal(res.status, 201);
    assert.deepEqual(await res.json(), { id: 1, text: 'buy milk' });
    const list = await (await fetch(\`\${base}/notes\`)).json();
    assert.equal(list.length, 1);
  }));

test('rejects a note with no text', () =>
  withServer(async (base) => {
    const res = await post(base, { text: '   ' });
    assert.equal(res.status, 400);
    const empty = await post(base, null);
    assert.equal(empty.status, 400);
  }));

test('deletes a note, and 404s for an unknown id', () =>
  withServer(async (base) => {
    await post(base, { text: 'one' });
    assert.equal((await fetch(\`\${base}/notes/1\`, { method: 'DELETE' })).status, 204);
    assert.equal((await fetch(\`\${base}/notes/1\`, { method: 'DELETE' })).status, 404);
  }));

test('notes survive a restart', async () => {
  const dir = fs.mkdtempSync(path.join(os.tmpdir(), 'notes-'));
  const file = path.join(dir, 'notes.json');
  createStore(file).add('remember me');
  assert.deepEqual(createStore(file).all(), [{ id: 1, text: 'remember me' }]);
});
